version: 2

builds:
  - main: ./cmd/gituy
    binary: gituy
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md]

checksum:
  name_template: checksums.txt

nfpms:
  - package_name: gituy
    description: Interactive git command builder
    formats: [deb, rpm, apk]
    dependencies: [git]

changelog:
  sort: asc
