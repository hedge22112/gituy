# Suggestion rules. `when` is an expr expression over the repo state:
#   branch, detached, has_commits, upstream, ahead, behind, staged, unstaged,
#   untracked, changed, conflicted, op, stash, head_pushed, remotes, remote,
#   clean, in_repo, upstream_gone, last_action, default_branch,
#   merged_branches, gone_branches, and for GitHub/GitLab (see
#   rules.EnvWith): forge_cli, forge_ready, forge_needs_login, forge_host,
#   pr, pr_number, pr_state, pr_draft, pr_review, pr_checks, pr_behind,
#   pr_conflicts, pr_base, review_queue
# Titles and preset strings may use templates ({{.branch}}); "@list" in an
# arg preset expands to every item of that list. `for_each` makes one
# suggestion per item of a list, available as {{.item}}.

# --- Conflicts / in-progress operations ---------------------------------

- id: resolve-mark
  when: op != "" && len(conflicted) > 0
  for_each: conflicted
  title: "Mark {{.item}} as resolved (after fixing it)"
  explain: Staging a conflicted file tells git you've resolved it.
  command: add
  preset: { args: { paths: ["{{.item}}"] } }
  priority: 96

- id: resolve-ours
  when: op != "" && len(conflicted) > 0
  title: "Keep one side's version of the conflicted files"
  explain: |
    --ours / --theirs pick a whole file from one side. Careful: during a
    rebase they're swapped. "ours" is the branch you're rebasing onto.
  command: checkout-side
  preset: { args: { paths: ["@conflicted"] } }
  priority: 90

- id: merge-continue
  when: op == "merge" && len(conflicted) == 0
  title: "Finish the merge"
  command: merge-continue
  priority: 100

- id: merge-abort
  when: op == "merge"
  title: "Abort the merge"
  explain: Puts everything back to how it was before the merge started.
  command: merge-abort
  priority: 60

- id: rebase-continue
  when: op == "rebase" && len(conflicted) == 0
  title: "Continue the rebase"
  command: rebase-continue
  priority: 100

- id: rebase-skip
  when: op == "rebase" && len(conflicted) > 0
  title: "Skip this commit"
  explain: Drops the commit that's conflicting from your branch.
  command: rebase-skip
  priority: 55

- id: rebase-abort
  when: op == "rebase"
  title: "Abort the rebase"
  explain: Puts your branch back to how it was before the rebase started.
  command: rebase-abort
  priority: 60

- id: cherry-pick-continue
  when: op == "cherry-pick" && len(conflicted) == 0
  title: "Continue the cherry-pick"
  command: cherry-pick-continue
  priority: 100

- id: cherry-pick-abort
  when: op == "cherry-pick"
  title: "Abort the cherry-pick"
  command: cherry-pick-abort
  priority: 60

- id: revert-continue
  when: op == "revert" && len(conflicted) == 0
  title: "Continue the revert"
  command: revert-continue
  priority: 100

- id: revert-abort
  when: op == "revert"
  title: "Abort the revert"
  command: revert-abort
  priority: 60

# --- Syncing with the remote --------------------------------------------

- id: force-push-rewritten
  when: 'op == "" && upstream != "" && !upstream_gone && ahead > 0 && behind > 0 && last_action matches "^(rebase|commit \\(amend\\)|reset)"'
  title: "Update {{.upstream}} with your rewritten history (force, safely)"
  explain: |
    You rebased or amended commits that were already pushed, so your branch
    and {{.upstream}} now disagree. --force-with-lease replaces the remote
    branch only if nobody else pushed to it since you last fetched.
  command: push
  preset: { flags: [--force-with-lease] }
  priority: 88

- id: pull-ff
  when: op == "" && upstream != "" && behind > 0 && ahead == 0
  title: "Pull {{.behind}} new commit(s) from {{.upstream}}"
  explain: You have no local commits, so this is a simple fast-forward.
  command: pull
  preset: { flags: [--ff-only] }
  priority: 82

- id: pull-rebase
  when: op == "" && upstream != "" && behind > 0 && ahead > 0
  title: "Rebase your {{.ahead}} commit(s) onto {{.upstream}}"
  explain: |
    Your branch and the remote have both moved. Rebasing replays your
    commits on top, keeping history linear.
  command: pull
  preset: { flags: [--rebase] }
  priority: 85

- id: pull-merge
  when: op == "" && upstream != "" && behind > 0 && ahead > 0
  title: "Merge {{.upstream}} into {{.branch}}"
  explain: Keeps both histories and creates a merge commit.
  command: pull
  preset: { flags: [--no-rebase] }
  priority: 70

- id: push
  when: op == "" && upstream != "" && ahead > 0 && behind == 0
  title: "Push {{.ahead}} commit(s) to {{.upstream}}"
  command: push
  priority: 75

- id: push-upstream
  when: op == "" && upstream == "" && has_commits && !detached && remote != ""
  title: "Publish {{.branch}} to {{.remote}}"
  explain: Pushes the branch and remembers it as the upstream.
  command: push
  preset:
    flags: [--set-upstream]
    args: { remote: ["{{.remote}}"], branch: ["{{.branch}}"] }
  priority: 65

- id: upstream-gone-switch
  when: op == "" && upstream_gone && !detached && default_branch != "" && branch != default_branch
  title: "{{.upstream}} was deleted: switch back to {{.default_branch}}"
  explain: |
    The remote branch you were tracking is gone, usually because its pull
    request was merged. Switch to {{.default_branch}}, pull, then delete
    {{.branch}}.
  command: switch
  preset: { args: { branch: ["{{.default_branch}}"] } }
  priority: 72

- id: upstream-gone-unset
  when: op == "" && upstream_gone && !detached
  title: "Stop tracking the deleted {{.upstream}}"
  command: branch-unset-upstream
  priority: 30

- id: fetch-all
  when: op == "" && len(remotes) > 0
  title: "Fetch all remotes"
  command: fetch
  preset: { flags: [--all, --prune] }
  priority: 10

# --- Local changes ------------------------------------------------------

- id: commit
  when: op == "" && len(staged) > 0
  title: "Commit {{len .staged}} staged file(s)"
  command: commit
  preset: { flags: [-m] }
  priority: 78

- id: add-all
  when: len(changed) > 0 && len(conflicted) == 0
  title: "Stage all changes ({{len .changed}} file(s))"
  command: add
  preset: { flags: [--all] }
  priority: 60

- id: add-pick
  when: len(changed) > 0 && len(conflicted) == 0
  title: "Choose files to stage"
  command: add
  priority: 55

- id: unstage
  when: len(staged) > 0
  title: "Unstage files (keep the edits)"
  command: restore
  preset: { flags: [--staged] }
  priority: 35

- id: stash
  when: op == "" && len(changed) + len(staged) > 0
  title: "Stash your changes for later"
  command: stash-push
  preset: { flags: [--include-untracked] }
  priority: 40

- id: discard
  when: len(unstaged) > 0 && len(conflicted) == 0
  title: "Discard changes to files"
  explain: Your edits to the chosen files are thrown away and can't be recovered.
  command: restore
  priority: 30

- id: stash-pop
  when: op == "" && stash > 0 && clean
  title: "Re-apply your latest stash ({{.stash}} saved)"
  command: stash-pop
  priority: 50

- id: undo-commit
  when: op == "" && has_commits && !head_pushed && !detached
  title: "Undo the last commit, keep its changes"
  explain: Only offered because the commit hasn't been pushed yet.
  command: reset
  preset: { flags: [--soft], args: { target: ["HEAD~1"] } }
  priority: 20

# --- Housekeeping -------------------------------------------------------

- id: delete-gone
  when: op == ""
  for_each: gone_branches
  title: "Delete {{.item}} (its remote branch was deleted)"
  explain: |
    If it was squash-merged, git will refuse because it can't see the merge.
    Check it's really done, then use -D.
  command: branch-delete
  preset: { args: { branch: ["{{.item}}"] } }
  priority: 16

- id: delete-merged
  when: op == "" && branch != "" && branch == default_branch
  for_each: merged_branches
  title: "Delete {{.item}} (already merged into {{.branch}})"
  command: branch-delete
  preset: { args: { branch: ["{{.item}}"] } }
  priority: 15

# --- Detached HEAD ------------------------------------------------------

- id: detached-branch
  when: detached && op == ""
  title: "Create a branch here (you're not on a branch)"
  explain: Commits made on a detached HEAD are easy to lose. Give them a branch.
  command: switch
  preset: { flags: [--create] }
  priority: 88

- id: detached-back
  when: detached && op == ""
  title: "Go back to the previous branch"
  command: switch
  preset: { args: { branch: ["-"] } }
  priority: 70

# --- Not in a repository ------------------------------------------------

- id: init
  when: "!in_repo"
  title: "Create a new repository here"
  command: init
  priority: 100

- id: clone
  when: "!in_repo"
  title: "Clone a repository"
  command: clone
  priority: 90

# --- GitHub / GitLab (both) ---------------------------------------------

- id: forge-login-gh
  when: forge_needs_login && forge_cli == "gh"
  title: "Log in to the GitHub CLI to see pull requests"
  command: gh-auth-login
  preset: { flags: [--hostname], values: { --hostname: "{{.forge_host}}" } }
  priority: 25

- id: forge-login-glab
  when: forge_needs_login && forge_cli == "glab"
  title: "Log in to the GitLab CLI to see merge requests"
  command: glab-auth-login
  preset: { flags: [--hostname], values: { --hostname: "{{.forge_host}}" } }
  priority: 25

- id: pr-merged
  when: op == "" && pr && pr_state == "merged" && default_branch != "" && branch != default_branch
  title: "#{{.pr_number}} was merged: switch back to {{.default_branch}}"
  explain: |
    Your work is in {{.default_branch}} now. Switch, pull, then delete
    {{.branch}} (gituy will suggest it).
  command: switch
  preset: { args: { branch: ["{{.default_branch}}"] } }
  priority: 84

- id: pr-conflicts
  when: op == "" && pr && pr_state == "open" && pr_conflicts && remote != "" && pr_base != ""
  title: "#{{.pr_number}} conflicts with {{.pr_base}}: rebase onto it to fix"
  explain: |
    Replays your commits on top of {{.remote}}/{{.pr_base}} so you can fix
    the conflicts locally, then push with --force-with-lease.
  command: pull
  preset:
    flags: [--rebase]
    args: { remote: ["{{.remote}}"], branch: ["{{.pr_base}}"] }
  priority: 83

# --- GitHub (gh) ---------------------------------------------------------

- id: gh-pr-create
  when: 'forge_cli == "gh" && forge_ready && !pr && op == "" && !detached && has_commits && upstream != "" && !upstream_gone && ahead == 0 && default_branch != "" && branch != default_branch'
  title: "Open a pull request for {{.branch}}"
  command: gh-pr-create
  preset: { flags: [--fill] }
  priority: 74

- id: gh-pr-changes-requested
  when: forge_cli == "gh" && pr && pr_state == "open" && pr_review == "changes_requested"
  title: "PR #{{.pr_number}}: changes requested, read the review"
  command: gh-pr-view
  preset: { flags: [--comments] }
  priority: 81

- id: gh-pr-checks-failing
  when: forge_cli == "gh" && pr && pr_state == "open" && pr_checks == "failing"
  title: "PR #{{.pr_number}}: checks are failing, see which"
  command: gh-pr-checks
  priority: 80

- id: gh-run-failed-logs
  when: forge_cli == "gh" && pr && pr_state == "open" && pr_checks == "failing"
  title: "Show the failed CI logs"
  command: gh-run-view
  preset: { flags: [--log-failed] }
  priority: 79

- id: gh-pr-merge
  when: 'forge_cli == "gh" && pr && pr_state == "open" && !pr_draft && pr_review == "approved" && pr_checks in ["passing", "none"] && !pr_behind && !pr_conflicts && op == "" && ahead == 0'
  title: "PR #{{.pr_number}} is approved and green: merge it"
  explain: Squash-merges on GitHub and deletes the branch. You'll be asked to confirm.
  command: gh-pr-merge
  preset: { flags: [--squash, --delete-branch] }
  priority: 77

- id: gh-pr-ready
  when: forge_cli == "gh" && pr && pr_state == "open" && pr_draft
  title: "PR #{{.pr_number}} is a draft: mark it ready for review"
  command: gh-pr-ready
  priority: 66

- id: gh-pr-update-branch
  when: forge_cli == "gh" && pr && pr_state == "open" && pr_behind && !pr_conflicts
  title: "PR #{{.pr_number}} is behind {{.pr_base}}: update it"
  explain: Merges {{.pr_base}} into the PR's branch on GitHub. Pull afterwards to get it locally.
  command: gh-pr-update-branch
  priority: 64

- id: gh-pr-checks-pending
  when: forge_cli == "gh" && pr && pr_state == "open" && pr_checks == "pending"
  title: "Watch PR #{{.pr_number}}'s checks"
  command: gh-pr-checks
  preset: { flags: [--watch] }
  priority: 40

- id: gh-pr-reopen
  when: forge_cli == "gh" && pr && pr_state == "closed"
  title: "PR #{{.pr_number}} was closed without merging: reopen it"
  command: gh-pr-reopen
  priority: 30

- id: gh-review-queue
  when: forge_cli == "gh" && forge_ready && review_queue > 0 && op == "" && clean
  title: "{{.review_queue}} PR(s) waiting for your review: check one out"
  command: gh-pr-checkout
  priority: 22

- id: gh-issue-develop
  when: forge_cli == "gh" && forge_ready && op == "" && clean && branch != "" && branch == default_branch
  title: "Start work on an issue"
  explain: Creates a branch linked to the issue on GitHub and switches to it.
  command: gh-issue-develop
  priority: 12

- id: gh-pr-web
  when: forge_cli == "gh" && pr && pr_state == "open"
  title: "Open PR #{{.pr_number}} in the browser"
  command: gh-pr-view
  preset: { flags: [--web] }
  priority: 8

# --- GitLab (glab) -------------------------------------------------------

- id: glab-mr-create
  when: 'forge_cli == "glab" && forge_ready && !pr && op == "" && !detached && has_commits && upstream != "" && !upstream_gone && ahead == 0 && default_branch != "" && branch != default_branch'
  title: "Open a merge request for {{.branch}}"
  command: glab-mr-create
  preset: { flags: [--fill] }
  priority: 74

- id: glab-mr-changes-requested
  when: forge_cli == "glab" && pr && pr_state == "open" && pr_review == "changes_requested"
  title: "MR !{{.pr_number}}: changes requested, read the comments"
  command: glab-mr-view
  preset: { flags: [--comments] }
  priority: 81

- id: glab-ci-failing
  when: forge_cli == "glab" && pr && pr_state == "open" && pr_checks == "failing"
  title: "MR !{{.pr_number}}: the pipeline failed, see which jobs"
  command: glab-ci-status
  priority: 80

- id: glab-ci-trace
  when: forge_cli == "glab" && pr && pr_state == "open" && pr_checks == "failing"
  title: "Show a failed job's log"
  command: glab-ci-trace
  priority: 79

- id: glab-mr-merge
  when: 'forge_cli == "glab" && pr && pr_state == "open" && !pr_draft && pr_review == "approved" && pr_checks in ["passing", "none"] && !pr_behind && !pr_conflicts && op == "" && ahead == 0'
  title: "MR !{{.pr_number}} is ready: merge it"
  explain: Squash-merges on GitLab and deletes the branch there. You'll be asked to confirm.
  command: glab-mr-merge
  preset: { flags: [--squash, --remove-source-branch] }
  priority: 77

- id: glab-mr-ready
  when: forge_cli == "glab" && pr && pr_state == "open" && pr_draft
  title: "MR !{{.pr_number}} is a draft: mark it ready"
  command: glab-mr-ready
  priority: 66

- id: glab-mr-rebase
  when: forge_cli == "glab" && pr && pr_state == "open" && pr_behind && !pr_conflicts
  title: "MR !{{.pr_number}} needs a rebase onto {{.pr_base}}: rebase it on GitLab"
  explain: GitLab rebases the branch on the server. Pull with --rebase afterwards.
  command: glab-mr-rebase
  priority: 64

- id: glab-ci-pending
  when: forge_cli == "glab" && pr && pr_state == "open" && pr_checks == "pending"
  title: "Watch MR !{{.pr_number}}'s pipeline"
  command: glab-ci-status
  preset: { flags: [--live] }
  priority: 40

- id: glab-review-queue
  when: forge_cli == "glab" && forge_ready && review_queue > 0 && op == "" && clean
  title: "{{.review_queue}} MR(s) waiting for your review: check one out"
  command: glab-mr-checkout
  priority: 22

- id: glab-mr-web
  when: forge_cli == "glab" && pr && pr_state == "open"
  title: "Open MR !{{.pr_number}} in the browser"
  command: glab-mr-view
  preset: { flags: [--web] }
  priority: 8
